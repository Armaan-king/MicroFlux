[project]
name = "microflux"
version = "0.1.0"
description = "Information propagation in high-frequency market activity and L2 order-book dynamics"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "numba>=0.60",
    "torch>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/microflux"]

[tool.pytest.ini_options]
testpaths = ["tests"]
